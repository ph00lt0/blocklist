name: Generate Blocklist Formats

on:
  push:
    branches: [main, master]
    paths:
      - 'blocklist.txt'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-formats:
    name: Generate All Formats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyfiglet --quiet

      - name: Run blocklist format generator
        run: python modules/update.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No format updates needed"
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit regenerated formats
        if: steps.changes.outputs.changes_detected == 'true'
        run: |
          git config user.name "The Great Replicator"
          git config user.email "replicator@ph00lt0.local"
          
          git add domains.txt rpz-blocklist.txt pihole-blocklist.txt hosts-blocklist.txt wildcard-blocklist.txt unbound-blocklist.txt little-snitch-blocklist.lsrules 2>/dev/null || true
          
          git commit -m "chore: regenerate blocklist formats (auto-generated from blocklist.txt)" \
            --allow-empty || echo "No changes to commit"
          
          git push origin HEAD:${{ github.ref_name }}

      - name: Summary
        run: |
          echo "## Blocklist Format Generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: Push to blocklist.txt" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.changes.outputs.changes_detected == 'true' && 'Formats regenerated ✓' || 'No changes' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Script**: \`modules/update.py\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Completed**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
